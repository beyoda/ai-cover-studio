uvr:
  enabled: true
  # DirectML GPU wrapper (CLI has no --use_directml). Falls back path: audio-separator without GPU.
  command: "<repo-root>\\.venv\\Scripts\\python.exe <repo-root>\\scripts\\uvr_directml.py {input} --output_dir {output_dir} --model_filename {model_name} --model_file_dir <repo-root>\\models\\uvr"
  model_name: "UVR_MDXNET_Main.onnx"
  vocal_glob: "*Vocals*.*"
  instrumental_glob: "*Instrumental*.*"
