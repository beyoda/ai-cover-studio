# so-vits-svc inference wiring.
#
# Path resolution (verified against src/aivoice_studio/modules/svc/svc_runner.py):
#   - project_dir     : relative to the repository root
#   - python          : relative to project_dir
#   - inference_script: relative to project_dir
#   - models_dir      : relative to the repository root
#
# Keep this file portable. Prefer relative paths so a clean clone works on any
# machine; if you need machine-specific values, edit your local copy instead of
# committing absolute paths (see ROADMAP.md, "P0 - Open-source readiness").
#
# The repository does NOT ship a CUDA/SVC runtime or any voice checkpoint.
# See docs/MODEL_GUIDE.md for how to obtain and register your own model.
svc:
  enabled: true
  mode: so-vits-svc
  python: workenv/python.exe
  project_dir: tools/so-vits-svc
  inference_script: inference_main.py
  command: '{python} {script} -m {model_path} -c {config_path} -n {input_name} -t {pitch} -s {speaker} -f0p {f0_method} -wf {output_format}'
  models_dir: tools/so-vits-svc/logs/44k
  f0_method: rmvpe
  pitch: 0
  speaker: output
  output_format: wav
